[project]
name = "kc-gemini-logo-cleaner"
version = "1.1.0"
description = "Công cụ Windows xử lý hàng loạt logo nhìn thấy ở góc phải dưới ảnh Gemini"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "Pillow==11.3.0",
]

[project.scripts]
kc-gemini-logo-cleaner = "kc_logo_cleaner.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
